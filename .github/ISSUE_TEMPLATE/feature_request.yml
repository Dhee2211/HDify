name: Feature request
description: Suggest an idea for HDify
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
    validations:
      required: true
  - type: textarea
    id: license
    attributes:
      label: If it needs a new model or library, what is its license?
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'm willing to open a PR for this
